apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: {app: reservation}
  template:
    metadata:
      labels: {app: reservation}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reservation
          image: library-reservation:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reservation-database
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reservation
  namespace: library
spec:
  selector: {app: reservation}
  ports:
    - name: http
      port: 80
      targetPort: http
