apiVersion: v1
kind: ServiceAccount
metadata:
  name: member
  namespace: library
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: member-config
  namespace: library
data:
  APP_ENV: aws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member
  namespace: library
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: member
  template:
    metadata:
      labels:
        app: member
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: member
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: member-schema
          image: "380560899065.dkr.ecr.ap-south-1.amazonaws.com/digital-library-dev/member@sha256:e71117c21d3f02794f35d0e123b0545b6e1fe39e803c81c2171f9a67502ce732"
          command: [python, -c]
          args:
            - "from app.database import configured_engine; from app.models import Base; engine = configured_engine(); Base.metadata.create_all(engine); engine.dispose()"
          envFrom:
            - configMapRef:
                name: member-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: member-database
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: rds-ca, mountPath: /etc/rds-ca, readOnly: true}
      containers:
        - name: member
          image: "380560899065.dkr.ecr.ap-south-1.amazonaws.com/digital-library-dev/member@sha256:e71117c21d3f02794f35d0e123b0545b6e1fe39e803c81c2171f9a67502ce732"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: member-config
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: member-database
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 100Mi
        - name: rds-ca
          configMap:
            name: rds-ca
---
apiVersion: v1
kind: Service
metadata:
  name: member
  namespace: library
spec:
  type: ClusterIP
  selector:
    app: member
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
