apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-public
  namespace: library
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - http:
        paths:
          # Keep these ALB patterns in order: availability must precede Catalog.
          - path: /books/*/availability
            pathType: ImplementationSpecific
            backend:
              service:
                name: availability
                port:
                  name: http
          - path: /members*
            pathType: ImplementationSpecific
            backend:
              service:
                name: member
                port:
                  name: http
          - path: /books*
            pathType: ImplementationSpecific
            backend:
              service:
                name: catalog
                port:
                  name: http
          - path: /reservations*
            pathType: ImplementationSpecific
            backend:
              service:
                name: reservation
                port:
                  name: http
          - path: /loans*
            pathType: ImplementationSpecific
            backend:
              service:
                name: lending
                port:
                  name: http
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  name: http
