apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 69.8.2
    helm:
      values: |
        grafana:
          admin:
            existingSecret: grafana-admin
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: library
                  folder: Digital Library
                  type: file
                  options: {path: /var/lib/grafana/dashboards}
          dashboards:
            library:
              service-health:
                json: |
                  {"title":"Digital Library Service Health","panels":[{"type":"timeseries","title":"RPS","targets":[{"expr":"sum(rate(http_requests_total[1m]))"}]},{"type":"timeseries","title":"Error rate","targets":[{"expr":"sum(rate(http_requests_total{status=~\"5..\"}[1m])) / sum(rate(http_requests_total[1m]))"}]},{"type":"timeseries","title":"Latency","targets":[{"expr":"histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))"}]},{"type":"timeseries","title":"Cluster CPU","targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total[1m]))"}]}]}
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
