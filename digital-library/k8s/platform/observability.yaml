apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 69.8.2
    helm:
      values: |
        alertmanager:
          enabled: false
        prometheusOperator:
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
        kube-state-metrics:
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
        prometheus-node-exporter:
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
        grafana:
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 384Mi}
          admin:
            existingSecret: grafana-admin
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: library
                  folder: Digital Library
                  type: file
                  options: {path: /var/lib/grafana/dashboards}
          dashboards:
            library:
              service-health:
                json: |
                  {"title":"Digital Library Service Health","panels":[{"type":"timeseries","title":"RPS","targets":[{"expr":"sum(rate(http_requests_total[1m]))"}]},{"type":"timeseries","title":"Error rate","targets":[{"expr":"sum(rate(http_requests_total{status=~\"5..\"}[1m])) / sum(rate(http_requests_total[1m]))"}]},{"type":"timeseries","title":"Latency","targets":[{"expr":"histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))"}]},{"type":"timeseries","title":"Cluster CPU","targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total[1m]))"}]}]}
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            retention: 1d
            retentionSize: 512MB
            resources:
              requests: {cpu: 200m, memory: 512Mi}
              limits: {cpu: 500m, memory: 1Gi}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
