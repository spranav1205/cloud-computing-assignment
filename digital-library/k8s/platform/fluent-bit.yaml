apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: library
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 1
        Log_Level info
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Tag kube.*
    [OUTPUT]
        Name cloudwatch_logs
        Match kube.*
        region ${AWS_REGION}
        log_group_name /digital-library/eks
        log_stream_prefix ${HOSTNAME}-
        auto_create_group true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: library
spec:
  selector:
    matchLabels: {app: fluent-bit}
  template:
    metadata:
      labels: {app: fluent-bit}
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.32.0
          env:
            - name: AWS_REGION
              value: ap-south-1
          volumeMounts:
            - {name: varlog, mountPath: /var/log}
            - {name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: config
          configMap: {name: fluent-bit-config}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: library
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/REPLACE-WITH-TERRAFORM-FLUENT-BIT-ROLE
