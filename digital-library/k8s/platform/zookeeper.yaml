apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: library
spec:
  serviceName: zookeeper
  replicas: 3
  selector:
    matchLabels: {app: zookeeper}
  template:
    metadata:
      labels: {app: zookeeper}
    spec:
      containers:
        - name: zookeeper
          image: bitnami/zookeeper:3.9
          ports:
            - name: client
              containerPort: 2181
          env:
            - name: ALLOW_ANONYMOUS_LOGIN
              value: "yes"
            - name: ZOO_SERVERS
              value: server.1=zookeeper-0.zookeeper.library.svc.cluster.local:2888:3888;server.2=zookeeper-1.zookeeper.library.svc.cluster.local:2888:3888;server.3=zookeeper-2.zookeeper.library.svc.cluster.local:2888:3888
          readinessProbe:
            tcpSocket: {port: client}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: library
spec:
  clusterIP: None
  selector: {app: zookeeper}
  ports:
    - name: client
      port: 2181
      targetPort: client
