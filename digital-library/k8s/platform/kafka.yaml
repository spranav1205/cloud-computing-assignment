apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: library
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.9
          ports:
            - name: broker
              containerPort: 9092
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.library.svc.cluster.local:9093
            - name: KAFKA_CFG_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.library.svc.cluster.local:9092
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_CFG_NUM_PARTITIONS
              value: "3"
          readinessProbe:
            tcpSocket: {port: broker}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: library
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - name: broker
      port: 9092
      targetPort: broker
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: library
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: bitnami/kafka:3.9
          command: ["/bin/bash", "-ec"]
          args:
            - |
              until kafka-topics.sh --bootstrap-server kafka.library.svc.cluster.local:9092 --list; do sleep 2; done
              kafka-topics.sh --bootstrap-server kafka.library.svc.cluster.local:9092 --create --if-not-exists --topic library.events.v1 --partitions 3 --replication-factor 1
              kafka-topics.sh --bootstrap-server kafka.library.svc.cluster.local:9092 --create --if-not-exists --topic library.analytics.results.v1 --partitions 3 --replication-factor 1
