apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digital-library
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/spranav1205/cloud-computing-assignment.git
    targetRevision: main
    path: digital-library/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: library
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
