name: digital-library-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [member, catalog, reservation, lending, availability, fine, notification]
    defaults:
      run:
        working-directory: digital-library/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Start Catalog test storage
        if: matrix.service == 'catalog'
        run: |
          docker compose -f ../../compose.yaml up --build -d dynamodb minio
          docker compose -f ../../compose.yaml run --rm minio-init
      - name: Wait for Catalog test storage
        if: matrix.service == 'catalog'
        run: |
          python - <<'PY'
          from time import monotonic, sleep
          from app.database import local_resource
          from app.covers import local_s3

          dynamodb, s3 = local_resource(), local_s3()
          deadline = monotonic() + 60
          try:
              while True:
                  try:
                      dynamodb.meta.client.list_tables()
                      s3.head_bucket(Bucket="library-covers")
                      break
                  except Exception:
                      if monotonic() >= deadline:
                          raise
                      sleep(1)
          finally:
              dynamodb.meta.client.close()
              s3.close()
          PY
      - run: python -m pytest -q -p no:cacheprovider
      - name: Catalog storage diagnostics
        if: failure() && matrix.service == 'catalog'
        run: docker compose -f ../../compose.yaml logs --tail=100 dynamodb minio

  flink-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-library/services/usage-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B verify

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-library/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - run: terraform test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - run: kustomize build digital-library/k8s > rendered.yaml
      - run: kustomize build digital-library/k8s/platform > rendered-platform.yaml
      - run: docker compose -f digital-library/compose.yaml config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-library/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js
      - run: node --check server.js

  lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q digital-library/services/notification-lambda
