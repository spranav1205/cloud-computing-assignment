name: digital-library-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [member, catalog, reservation, lending, availability, fine, notification]
    defaults:
      run:
        working-directory: digital-library/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider

  flink-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-library/services/usage-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B verify

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-library/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - run: kustomize build digital-library/k8s > rendered.yaml
